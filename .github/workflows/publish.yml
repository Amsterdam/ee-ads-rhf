name: Publish

on:
  workflow_run:
    workflows: [Lint and test]
    types: [completed]
    branches: [main]
  # Allows re-running the publish step by hand when a previous run created the
  # release but failed before (or during) the actual npm publish, e.g. because
  # the unrelated Storybook/Pages deploy step failed.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Required for trusted publishing to npm
  pull-requests: write

jobs:
  create-release-and-publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Create release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main

      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # This is necessary because on.workflow_run always runs on the
          # default branch, which is 'develop' in our case
          ref: 'main'

      - name: Set up Node.js version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # The logic below handles the npm publication. It runs before the
      # Storybook/Pages deploy so that a Pages deploy failure can no longer
      # block the actual package publish (see incident on ee-ads-rhf 0.0.8).
      - name: Publish
        run: npm publish -w @amsterdam/ee-ads-rhf
        # A publish should happen when a new release was just created, or
        # when this workflow is triggered manually to retry a publish that
        # was skipped/failed in an earlier run for an already-released version.
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}

      # The logic below handles the Storybook deploy:
      - name: Build Storybook
        run: npm run storybook:build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: storybook/dist
          single-commit: true
        # A failed Pages deploy shouldn't fail the whole job now that it runs
        # after the npm publish; it can simply be retried on its own.
        continue-on-error: true
